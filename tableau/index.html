<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tableau interactif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#ffffff; --ink:#1f2933; --muted:#64707d; --line:#dfe4ea; --hover:#f1f4f8;
  --accent:#2563eb; --accent-soft:#e5edff; --danger:#dc2626;
  --shadow:0 8px 28px rgba(15,23,42,.16),0 1px 3px rgba(15,23,42,.10);
  --r:16px; --btn:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;display:block}
#bg{z-index:0}#weblayer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}#main{z-index:2}#over{z-index:3}
#weblayer.front{z-index:12}
.web{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.22);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;pointer-events:none}
.web .cap{height:30px;flex:none;background:#eef1f5;border-bottom:1px solid #d5dbe2;font:13px/30px "Segoe UI",system-ui,sans-serif;color:#45505c;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web.live .cap{background:#1f2933;color:#fff}
.web.live .cap b{color:#ff5252}
.web iframe,.web video{flex:1;width:100%;border:0;display:block;background:#fff;min-height:0}
.web video{background:#000;object-fit:contain}
.web .ended{position:absolute;inset:30px 0 0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:#2b333d;color:#fff;font:18px "Segoe UI",sans-serif}
.web.off .ended{display:flex}
.web.interact{pointer-events:auto;outline:4px solid var(--accent)}
#webExit{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;display:none;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:600;box-shadow:var(--shadow);cursor:pointer}
#webExit.show{display:block}
body.capturing #main,body.capturing #over,body.capturing .panel,body.capturing #toast,body.capturing #webExit{visibility:hidden!important}
#selbar .webonly{display:none}
#selbar.isweb .webonly{display:flex}
#selbar.islive .webonly.w{display:none}
.urlIn{width:100%;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
.urlIn:focus{border-color:var(--accent)}
#over{touch-action:none;cursor:crosshair}
body.t-select #over{cursor:default}
body.t-hand #over,body.panning #over{cursor:grab}
body.grabbing #over{cursor:grabbing!important}
body.t-eraser #over,body.t-laser #over{cursor:none}
body.t-text #over{cursor:text}
body.t-stamp #over{cursor:copy}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;flex:none}
button{font:inherit;color:inherit}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow)}
.ib{width:var(--btn);height:var(--btn);border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib .more{position:absolute;right:5px;bottom:5px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;opacity:.55}
.sep{height:1px;background:var(--line);margin:4px 6px}
.vsep{width:1px;align-self:stretch;background:var(--line);margin:6px 4px}

/* Barre d'outils gauche */
#toolbar{position:fixed;left:12px;top:84px;display:flex;flex-direction:column;gap:1px;padding:5px;max-height:calc(100% - 96px);overflow-y:auto;z-index:20;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}

/* Barres du haut */
#topLeft,#topRight{position:fixed;top:12px;display:flex;align-items:center;gap:2px;padding:6px;z-index:20}
#topLeft{left:12px}
#topRight{right:12px}
#pageLabel,#zoomLabel{min-width:64px;height:var(--btn);border:0;background:transparent;border-radius:12px;font-weight:600;font-size:17px;cursor:pointer;padding:0 8px;font-variant-numeric:tabular-nums}
#pageLabel:hover,#zoomLabel:hover{background:var(--hover)}

/* Barre de propriétés */
#props{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:8px 10px;z-index:20;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
#props:empty{display:none}
#props::-webkit-scrollbar{display:none}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);cursor:pointer;flex:none;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.swc{position:relative;overflow:hidden;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.swc input{position:absolute;inset:-10px;opacity:0;cursor:pointer;width:200%;height:200%}
.sz{width:46px;height:46px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sz:hover{background:var(--hover)}
.sz.on{background:var(--accent-soft)}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.pill{height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap;flex:none}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
select.pill{appearance:auto}
.hint{font-size:15px;color:var(--muted);padding:0 8px;white-space:nowrap}

/* Menus déroulants */
.fly{position:fixed;z-index:40;padding:10px;display:none;max-height:calc(100% - 24px);overflow-y:auto}
.fly.open{display:block}
.fly h4{margin:6px 6px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,58px);gap:4px}
.grid.g6{grid-template-columns:repeat(6,58px)}
.gb{width:58px;height:58px;border:0;border-radius:12px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.gb:hover{background:var(--hover)}
.gb.on{background:var(--accent-soft);color:var(--accent)}
.gb.word{font-size:15px;font-weight:700;width:auto;padding:0 6px}
.grid.words{grid-template-columns:repeat(4,auto)}
.list{display:flex;flex-direction:column;gap:2px;min-width:260px}
.li{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-size:16px;text-align:left;cursor:pointer}
.li:hover{background:var(--hover)}
.li.on{background:var(--accent-soft);color:var(--accent)}
.li small{display:block;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tab{border:0;background:var(--hover);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.bgGrid{display:grid;grid-template-columns:repeat(3,96px);gap:8px}
.bgb{border:2px solid transparent;border-radius:12px;background:transparent;padding:4px;cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bgb canvas{position:static;border-radius:8px;box-shadow:0 0 0 1px var(--line);width:84px;height:56px}
.bgb.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.paper{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.paper.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* Barre de sélection */
#selbar{position:fixed;display:none;gap:2px;padding:4px;z-index:25}
#selbar .ib{width:46px;height:46px}

/* Panneau des pages */
#pagesPanel{position:fixed;right:12px;top:84px;bottom:14px;width:268px;z-index:30;display:none;flex-direction:column;padding:10px}
#pagesPanel.open{display:flex}
#pagesPanel header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-weight:700}
#thumbs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.th{border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;background:#fff}
.th.on{border-color:var(--accent)}
.th canvas{position:static;width:100%;height:auto;border-radius:6px;display:block}
.th .bar{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:14px;font-weight:600}
.th .bar span{padding-left:4px}
.th .bar div{display:flex}
.th .ib{width:34px;height:34px;border-radius:8px}
.th .ib svg{width:18px;height:18px}

/* Modale, toast */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal.open{display:flex}
#modal .box{max-width:560px;width:100%;padding:22px 24px;max-height:90vh;overflow:auto;-webkit-user-select:text;user-select:text}
#modal h3{margin:0 0 10px;font-size:21px}
#modal p,#modal li{font-size:16px;line-height:1.5}
#modal .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
kbd{background:var(--hover);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:14px}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:.95}

#textEd{position:fixed;display:none;z-index:15;background:rgba(255,255,255,.04);border:2px dashed var(--accent);border-radius:4px;outline:none;resize:none;overflow:hidden;white-space:pre;padding:0;margin:0;line-height:1.25;-webkit-user-select:text;user-select:text}
#dropHint{position:fixed;inset:12px;border:4px dashed var(--accent);border-radius:24px;background:rgba(37,99,235,.08);display:none;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--accent);z-index:80;pointer-events:none}
#dropHint.show{display:flex}

/* Rendu temporaire des documents Word */
.docx-host{position:fixed;left:0;top:0;z-index:-10;pointer-events:none}
.docx-page{width:816px;min-height:1056px;padding:72px;background:#fff;color:#000;font-family:Calibri,Carlito,Arial,sans-serif;font-size:15px;line-height:1.45;position:relative;overflow:hidden}
.docx-page img{max-width:100%;height:auto}
.docx-page table{border-collapse:collapse;margin:8px 0;max-width:100%}
.docx-page td,.docx-page th{border:1px solid #888;padding:4px 6px;vertical-align:top}
.docx-page h1{font-size:26px;margin:0 0 12px}.docx-page h2{font-size:21px;margin:16px 0 8px}.docx-page h3{font-size:18px;margin:14px 0 6px}
.docx-page p{margin:0 0 10px}

#print{display:none}
@media print{
  @page{size:landscape;margin:8mm}
  body>*:not(#print){display:none!important}
  html,body{overflow:visible;height:auto;background:#fff}
  #print{display:block}
  #print .pp{page-break-after:always;break-after:page;display:flex;align-items:center;justify-content:center;height:190mm}
  #print .pp:last-child{page-break-after:auto;break-after:auto}
  #print img{max-width:100%;max-height:190mm}
}
@media (max-height:1000px){ :root{--btn:46px} }
@media (max-height:860px){ :root{--btn:40px} svg.i{width:23px;height:23px} }
@media (max-width:700px){ :root{--btn:44px} .grid{grid-template-columns:repeat(4,50px)} .gb{width:50px;height:50px} }
</style>
</head>

  'Maths': { font: 'serif', items: ['π', '√', '∞', '±', '×', '÷', '=', '≠', '≈', '≤', '≥', '<', '>', '∠', '°', '⊥', '∥', '△', '∑', '∫', '½', '⅓', '¼', '¾', '∈', '∅', '∩', '∪', '%', '$', 'x²', 'x³', 'a/b', 'Δ', 'θ', 'α'] },

/* ---------- État ---------- */

  doc: null, cur: 0,
  tool: 'pen', color: '#1a1a1a', hlColor: '#ffeb3b', size: 1,
  fill: 'none', dash: false, shape: 'rect', arrow: 'arrow', font: 'sans',
  stamp: null, stampSet: 'Musique', sel: [],

const hist = new Map();
const imgCache = new Map();

function newPage(bg) {

const page = () => S.doc.pages[S.cur];
const V = () => page().view;
const isDark = pg => pg.bg.paper === 'green' || pg.bg.paper === 'black';

/* ---------- Canvas ---------- */
const bgc = $('#bg'), main = $('#main'), over = $('#over'), bgctx = bgc.getContext('2d');

const measureCtx = document.createElement('canvas').getContext('2d');

function resize() {
  DPR = window.devicePixelRatio || 1; W = window.innerWidth; H = window.innerHeight;
  for (const c of [bgc, main, over]) { c.width = Math.round(W * DPR); c.height = Math.round(H * DPR); c.style.width = W + 'px'; c.style.height = H + 'px'; }
  render();
}
let rafMain = 0, rafOver = 0;
function render() { if (!rafMain) rafMain = requestAnimationFrame(() => { rafMain = 0; drawMain(); drawOverlay(); }); }

const toWorld = (sx, sy, v = V()) => ({ x: (sx - v.x) / v.z, y: (sy - v.y) / v.z });

/* ---------- Géométrie ---------- */
let bbCache = new WeakMap();
let tmCache = new WeakMap();

function fontOf(o, scale = 1) { return `${o.b ? '700 ' : ''}${o.s * scale}px ${FONTS[o.f] || FONTS.sans}`; }
function textMetrics(o) {
  let m = tmCache.get(o); if (m) return m;
  measureCtx.font = fontOf(o);
  const lines = (o.text || '').split('\n');
  let w = 0; for (const l of lines) w = Math.max(w, measureCtx.measureText(l).width);
  m = { w: Math.max(w, o.s * .3), h: lines.length * o.s * 1.25, lines };
  tmCache.set(o, m); return m;
}
function arrowSize(o) { return Math.max(12, o.w * 3.2); }
function quadAt(o, t) { const u = 1 - t; return [u * u * o.x1 + 2 * u * t * o.cx + t * t * o.x2, u * u * o.y1 + 2 * u * t * o.cy + t * t * o.y2]; }
function circParams(o) {
  const cx = (o.x1 + o.x2) / 2, cy = (o.y1 + o.y2) / 2, rx = Math.abs(o.x2 - o.x1) / 2, ry = Math.abs(o.y2 - o.y1) / 2;

  const a1 = ccw ? a0 - Math.PI * 1.7 : a0 + Math.PI * 1.7;
  return { cx, cy, rx, ry, a0, a1, ccw };
}
function shapePolys(o) {
  const k = o.k;
  if (POLY[k]) {
    const pts = POLY[k].map(([u, v]) => [o.x1 + u * (o.x2 - o.x1), o.y1 + v * (o.y2 - o.y1)]);
    pts.push(pts[0]); return [{ pts, closed: true }];
  }
  if (k === 'ellipse') {
    const cx = (o.x1 + o.x2) / 2, cy = (o.y1 + o.y2) / 2, rx = Math.abs(o.x2 - o.x1) / 2, ry = Math.abs(o.y2 - o.y1) / 2;
    const pts = []; for (let i = 0; i <= 48; i++) { const a = i / 48 * Math.PI * 2; pts.push([cx + rx * Math.cos(a), cy + ry * Math.sin(a)]); }
    return [{ pts, closed: true }];

  if (k === 'curve') { const pts = []; for (let i = 0; i <= 24; i++) pts.push(quadAt(o, i / 24)); return [{ pts }]; }

function ptsBox(pts, pad) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const [x, y] of pts) { if (x < x0) x0 = x; if (y < y0) y0 = y; if (x > x1) x1 = x; if (y > y1) y1 = y; }

function closeModal(v) { $('#modal').classList.remove('open'); if (modalResolve) { const r = modalResolve; modalResolve = null; r(v); } }
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(null); });
function showHelp() {
  modal('Aide — Tableau interactif', `
  <p><b>Se déplacer dans le tableau</b> (il est infini) :</p>
  <ul>
    <li>Outil <b>Sélection</b> : touchez le fond et glissez.</li>
    <li>N’importe quel outil : <kbd>Ctrl</kbd> + glisser, <kbd>Espace</kbd> + glisser, ou bouton du milieu / droit de la souris.</li>
    <li>Écran tactile : <b>deux doigts</b> pour déplacer et zoomer.</li>
    <li>Molette : zoom. <kbd>Maj</kbd> + molette : défilement horizontal.</li>
  </ul>
  <p><b>Objets</b> : avec l’outil Sélection, touchez un objet pour le déplacer; tirez les coins pour le redimensionner. Double-cliquez un texte pour le modifier. Les documents PDF/Word insérés sont <b>verrouillés</b> (double-clic pour les sélectionner).</p>
  <p><b>Raccourcis</b> : <kbd>V</kbd> sélection, <kbd>H</kbd> main, <kbd>P</kbd> crayon, <kbd>S</kbd> surligneur, <kbd>E</kbd> gomme, <kbd>R</kbd> formes, <kbd>F</kbd> flèches, <kbd>T</kbd> texte, <kbd>L</kbd> laser,
  <kbd>Ctrl+Z</kbd> annuler, <kbd>Ctrl+Y</kbd> rétablir, <kbd>Suppr</kbd> supprimer, <kbd>Ctrl+D</kbd> dupliquer, <kbd>Ctrl+V</kbd> coller une image ou du texte,
  <kbd>Page préc./suiv.</kbd> changer de page, <kbd>0</kbd> tout afficher, <kbd>Ctrl+S</kbd> enregistrer.</p>
  <p><b>Pages web</b> : <i>Insérer → Page web</i> affiche un site en direct; écrivez par-dessus. Pour cliquer ou défiler dans la page, sélectionnez-la puis touchez le bouton « main ». Si le site refuse de s’afficher, utilisez <i>Insérer → Onglet ou fenêtre en direct</i>. Le bouton « Figer » (appareil photo) transforme la page en image pour que les annotations restent alignées.</p>
  <p><b>Sauvegarde</b> : le tableau est conservé automatiquement dans ce navigateur. Pour le garder ou le partager, utilisez <i>Menu → Enregistrer le tableau</i> (fichier .tableau).</p>`,
    [{ label: 'Fermer', value: true, cls: 'primary' }]);
}
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => toast('Plein écran indisponible. Essayez F11.'));
}

$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);
$('#bClear').addEventListener('click', () => {
  if (!page().objects.length) return;
  snapshot(); page().objects = []; afterChange(); toast('Page effacée — Ctrl+Z ou ↶ pour annuler');
});
$('#bZoomIn').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.25));
$('#bZoomOut').addEventListener('click', () => zoomAt(W / 2, H / 2, .8));
$('#zoomLabel').addEventListener('click', zoomReset);
$('#bFit').addEventListener('click', fitAll);
$('#bPrev').addEventListener('click', () => goPage(S.cur - 1));
$('#bNext').addEventListener('click', () => goPage(S.cur + 1));
$('#bAddPage').addEventListener('click', addPage);
$('#bAddPage2').addEventListener('click', addPage);
$('#pageLabel').addEventListener('click', () => $('#pagesPanel').classList.contains('open') ? closePages() : openPages());
$('#bPages').addEventListener('click', () => $('#pagesPanel').classList.contains('open') ? closePages() : openPages());
$('#bClosePages').addEventListener('click', closePages);
$('#bFull').addEventListener('click', toggleFull);
$('#bHelp').addEventListener('click', showHelp);
window.addEventListener('resize', () => { resize(); layoutTextEditor(); });

// Rafraîchit les mesures quand les polices (musique, Andika) sont chargées
function fontsChanged() { clefCache = {}; tmCache = new WeakMap(); bbCache = new WeakMap(); render(); }
if (document.fonts) {
  document.fonts.addEventListener?.('loadingdone', fontsChanged);
  Promise.all([document.fonts.load(`40px "Noto Music"`, '\u{1D11E}'), document.fonts.load('40px Andika')]).then(fontsChanged).catch(() => {});
}

/* ---------- Démarrage ---------- */
(async function init() {
  S.doc = { pages: [newPage()], assets: {} };
  try { const d = await DB.get('doc'); if (d) loadDoc(d); } catch (_) {}
  resize(); setTool('pen'); adaptInk(); goPage(S.cur);
})();
</script>
</body>
</html>
