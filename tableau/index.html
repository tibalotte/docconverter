<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Tableau interactif</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Noto+Music&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#ffffff; --ink:#1f2933; --muted:#64707d; --line:#dfe4ea; --hover:#f1f4f8;
  --accent:#2563eb; --accent-soft:#e5edff; --danger:#dc2626;
  --shadow:0 8px 28px rgba(15,23,42,.16),0 1px 3px rgba(15,23,42,.10);
  --r:16px; --btn:52px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;left:0;top:0;display:block}
#bg{z-index:0}#weblayer{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}#main{z-index:2}#over{z-index:3}
#weblayer.front{z-index:12}
.web{position:absolute;left:0;top:0;transform-origin:0 0;background:#fff;box-shadow:0 2px 14px rgba(0,0,0,.22);border-radius:6px;overflow:hidden;display:flex;flex-direction:column;pointer-events:none}
.web .cap{height:30px;flex:none;background:#eef1f5;border-bottom:1px solid #d5dbe2;font:13px/30px "Segoe UI",system-ui,sans-serif;color:#45505c;padding:0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.web.live .cap{background:#1f2933;color:#fff}
.web.live .cap b{color:#ff5252}
.web iframe,.web video{flex:1;width:100%;border:0;display:block;background:#fff;min-height:0}
.web video{background:#000;object-fit:contain}
.web .ended{position:absolute;inset:30px 0 0;display:none;align-items:center;justify-content:center;text-align:center;padding:20px;background:#2b333d;color:#fff;font:18px "Segoe UI",sans-serif}
.web.off .ended{display:flex}
.web.interact{pointer-events:auto;outline:4px solid var(--accent)}
#webExit{position:fixed;left:50%;top:14px;transform:translateX(-50%);z-index:50;display:none;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:14px 22px;font-size:17px;font-weight:600;box-shadow:var(--shadow);cursor:pointer}
#webExit.show{display:block}
body.capturing #main,body.capturing #over,body.capturing .panel,body.capturing #toast,body.capturing #webExit{visibility:hidden!important}
.web .cap em{font-style:normal;color:#7b8794}
#lp{position:fixed;z-index:45;display:none;gap:8px;padding:10px;align-items:stretch}
#lp.open{display:flex}
#lp .lpi{width:84px;min-height:84px;border:0;border-radius:14px;background:var(--hover);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;font-size:12px;color:var(--muted);padding:6px 4px;text-align:center;line-height:1.15}
#lp .lpi.hot,#lp .lpi:hover{background:var(--accent-soft);color:var(--accent)}
#lp .lpi .g{font-size:26px;line-height:1;color:var(--ink);display:flex;align-items:center;gap:4px}
#lp .lpi .g i{width:12px;height:12px;border-radius:50%;display:inline-block;box-shadow:0 0 0 1px rgba(0,0,0,.2)}
#lp .empty{max-width:240px;font-size:14px;color:var(--muted);padding:6px}
.ib.sticky::after{content:'';position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
#studio{position:fixed;inset:0;z-index:90;background:#eef1f5;display:none;flex-direction:column}
#studio.open{display:flex}
.s3top{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px 10px;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08);z-index:2}
.s3top .pill:disabled{opacity:.4;cursor:default}
.s3main{flex:1;display:flex;min-height:0}
.s3shapes{width:108px;overflow-y:auto;background:#fff;padding:8px;display:flex;flex-direction:column;gap:6px;border-right:1px solid var(--line)}
.s3shape{border:0;border-radius:12px;background:var(--hover);padding:10px 4px;font-size:12px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;line-height:1.15}
.s3shape:hover{background:var(--accent-soft);color:var(--accent)}
.s3shape svg{width:34px;height:34px;stroke-width:1.6}
.s3view{flex:1;position:relative;min-width:0;touch-action:none}
.s3view canvas{position:absolute!important;inset:0;width:100%!important;height:100%!important;display:block}
.s3labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.s3l{position:absolute;transform:translate(-50%,-50%);font:400 11px "Segoe UI",system-ui,sans-serif;color:#7b8794;white-space:nowrap}
.s3l.ax{font:700 15px "Segoe UI",system-ui,sans-serif}.s3l.x{color:#e53935}.s3l.y{color:#2e7d32}.s3l.z{color:#1e63d6}
.s3l.dim{font:700 14px "Segoe UI",system-ui,sans-serif;color:#111;background:rgba(255,255,255,.88);padding:2px 7px;border-radius:7px;border:1px solid #c9d1da}
.s3panel{width:300px;background:#fff;overflow-y:auto;padding:14px 16px;border-left:1px solid var(--line);-webkit-user-select:text;user-select:text}
.s3panel h3{margin:0 0 10px;font-size:19px}.s3panel h3 small{color:var(--muted);font-weight:400}
.s3panel h4{margin:14px 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.s3panel p{font-size:15px;line-height:1.45;margin:0 0 8px}
.s3row{display:flex;align-items:center;gap:4px;margin:4px 0}
.s3row label{flex:1;font-size:14px}
.s3row input{width:74px;height:38px;border:1px solid var(--line);border-radius:8px;font-size:16px;text-align:center;-webkit-user-select:text;user-select:text}
.s3row button{width:38px;height:38px;border:0;border-radius:8px;background:var(--hover);font-size:20px;cursor:pointer}
.s3row span{width:26px;font-size:13px;color:var(--muted)}
.s3meas{margin-top:14px;background:var(--hover);border-radius:12px;padding:10px 12px;display:grid;gap:6px}
.s3meas div{display:flex;justify-content:space-between;font-size:15px}
.s3hint{color:var(--muted);font-size:14px!important}
.pchip{height:40px;border:0;border-radius:12px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:14px;padding:0 12px;cursor:pointer;white-space:nowrap;margin-left:4px}
body.locked .pchip{background:#fde8e8;color:#b42318}
body.locked .lockhide{display:none!important}
.lvlGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 14px}
.lvl{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 8px;cursor:pointer;text-align:center;font-size:16px;font-weight:700}
.lvl small{display:block;font-weight:400;color:var(--muted);font-size:13px;margin-top:2px}
.lvl.on{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.toolChecks{display:grid;grid-template-columns:repeat(2,1fr);gap:4px 12px;margin-top:8px}
.toolChecks label{display:flex;align-items:center;gap:8px;font-size:15px;padding:4px 0}
.toolChecks input{width:20px;height:20px}
details.custom summary{cursor:pointer;font-weight:600;color:var(--accent);margin-top:6px}
#selbar .webonly{display:none}
#selbar.isweb .webonly{display:flex}
#selbar.islive .webonly.w{display:none}
.urlIn{width:100%;font-size:18px;padding:12px 14px;border:2px solid var(--line);border-radius:12px;outline:none;-webkit-user-select:text;user-select:text}
.urlIn:focus{border-color:var(--accent)}
#over{touch-action:none;cursor:crosshair}
body.t-select #over{cursor:default}
body.t-hand #over,body.panning #over{cursor:grab}
body.grabbing #over{cursor:grabbing!important}
body.t-eraser #over,body.t-laser #over{cursor:none}
body.t-text #over{cursor:text}
body.t-lasso #over{cursor:crosshair}
body.tmode #over{cursor:crosshair!important}
body.t-fr #over{cursor:crosshair}
body.t-stamp #over{cursor:copy}
svg.i{width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none;flex:none}
button{font:inherit;color:inherit}
.panel{background:var(--panel);border-radius:var(--r);box-shadow:var(--shadow)}
.ib{width:var(--btn);height:var(--btn);border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex:none}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--accent-soft);color:var(--accent)}
.ib:disabled{opacity:.35;cursor:default}
.ib .more{position:absolute;right:5px;bottom:5px;width:0;height:0;border-left:5px solid transparent;border-bottom:5px solid currentColor;opacity:.55}
.sep{height:1px;background:var(--line);margin:4px 6px}
.vsep{width:1px;align-self:stretch;background:var(--line);margin:6px 4px}

/* Barre d'outils gauche */
#toolbar{position:fixed;left:12px;top:84px;display:flex;flex-direction:column;gap:1px;padding:5px;max-height:calc(100% - 96px);overflow-y:auto;z-index:20;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}

/* Barres du haut */
#topLeft,#topRight{position:fixed;top:12px;display:flex;align-items:center;gap:2px;padding:6px;z-index:20}
#topLeft{left:12px}
#topRight{right:12px}
#pageLabel,#zoomLabel{min-width:64px;height:var(--btn);border:0;background:transparent;border-radius:12px;font-weight:600;font-size:17px;cursor:pointer;padding:0 8px;font-variant-numeric:tabular-nums}
#pageLabel:hover,#zoomLabel:hover{background:var(--hover)}

/* Barre de propriétés */
#props{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:8px 10px;z-index:20;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none}
#props:empty{display:none}
#props::-webkit-scrollbar{display:none}
.sw{width:40px;height:40px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);cursor:pointer;flex:none;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--accent)}
.swc{position:relative;overflow:hidden;background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red)}
.swc input{position:absolute;inset:-10px;opacity:0;cursor:pointer;width:200%;height:200%}
.sz{width:46px;height:46px;border:0;border-radius:12px;background:transparent;display:flex;align-items:center;justify-content:center;cursor:pointer;flex:none}
.sz:hover{background:var(--hover)}
.sz.on{background:var(--accent-soft)}
.sz i{display:block;border-radius:50%;background:var(--ink)}
.pill{height:44px;border:1px solid var(--line);border-radius:12px;background:#fff;padding:0 12px;cursor:pointer;display:flex;align-items:center;gap:6px;font-size:15px;white-space:nowrap;flex:none}
.pill.on{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
select.pill{appearance:auto}
.hint{font-size:15px;color:var(--muted);padding:0 8px;white-space:nowrap}

/* Menus déroulants */
.fly{position:fixed;z-index:40;padding:10px;display:none;max-height:calc(100% - 24px);overflow-y:auto}
.fly.open{display:block}
.fly h4{margin:6px 6px 8px;font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(4,58px);gap:4px}
.grid.g6{grid-template-columns:repeat(6,58px)}
.gb{width:58px;height:58px;border:0;border-radius:12px;background:transparent;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:30px;line-height:1}
.gb:hover{background:var(--hover)}
.gb.on{background:var(--accent-soft);color:var(--accent)}
.gb.word{font-size:15px;font-weight:700;width:auto;padding:0 6px}
.grid.words{grid-template-columns:repeat(4,auto)}
.list{display:flex;flex-direction:column;gap:2px;min-width:260px}
.li{display:flex;align-items:center;gap:12px;border:0;background:transparent;border-radius:10px;padding:10px 12px;font-size:16px;text-align:left;cursor:pointer}
.li:hover{background:var(--hover)}
.li.on{background:var(--accent-soft);color:var(--accent)}
.li small{display:block;color:var(--muted);font-size:13px}
.tabs{display:flex;gap:4px;margin-bottom:8px;flex-wrap:wrap}
.tab{border:0;background:var(--hover);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.tab.on{background:var(--accent);color:#fff}
.bgGrid{display:grid;grid-template-columns:repeat(3,96px);gap:8px}
.bgb{border:2px solid transparent;border-radius:12px;background:transparent;padding:4px;cursor:pointer;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:4px}
.bgb canvas{position:static;border-radius:8px;box-shadow:0 0 0 1px var(--line);width:84px;height:56px}
.bgb.on{border-color:var(--accent);color:var(--accent)}
.row{display:flex;gap:6px;flex-wrap:wrap;margin:4px 0 10px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;cursor:pointer;font-size:14px}
.chip.on{background:var(--accent);border-color:var(--accent);color:#fff}
.paper{width:38px;height:38px;border-radius:10px;border:2px solid var(--line);cursor:pointer}
.paper.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}

/* Barre de sélection */
#selbar{position:fixed;display:none;gap:2px;padding:4px;z-index:25}
#selbar .ib{width:46px;height:46px}

/* Panneau des pages */
#pagesPanel{position:fixed;right:12px;top:84px;bottom:14px;width:268px;z-index:30;display:none;flex-direction:column;padding:10px}
#pagesPanel.open{display:flex}
#pagesPanel header{display:flex;align-items:center;justify-content:space-between;padding:4px 6px 10px;font-weight:700}
#thumbs{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:10px;padding:2px}
.th{border:2px solid var(--line);border-radius:12px;padding:6px;cursor:pointer;background:#fff}
.th.on{border-color:var(--accent)}
.th canvas{position:static;width:100%;height:auto;border-radius:6px;display:block}
.th .bar{display:flex;align-items:center;justify-content:space-between;margin-top:4px;font-size:14px;font-weight:600}
.th .bar span{padding-left:4px}
.th .bar div{display:flex}
.th .ib{width:34px;height:34px;border-radius:8px}
.th .ib svg{width:18px;height:18px}

/* Modale, toast */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.35);display:none;align-items:center;justify-content:center;z-index:60;padding:16px}
#modal.open{display:flex}
#modal .box{max-width:560px;width:100%;padding:22px 24px;max-height:90vh;overflow:auto;-webkit-user-select:text;user-select:text}
#modal h3{margin:0 0 10px;font-size:21px}
#modal p,#modal li{font-size:16px;line-height:1.5}
#modal .btns{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;margin-top:18px}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px 18px;font-size:16px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
kbd{background:var(--hover);border:1px solid var(--line);border-radius:6px;padding:1px 6px;font-size:14px}
#toast{position:fixed;left:50%;top:84px;transform:translateX(-50%);background:#1f2933;color:#fff;padding:12px 20px;border-radius:12px;font-size:16px;z-index:70;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%;text-align:center}
#toast.show{opacity:.95}

#textEd{position:fixed;display:none;z-index:15;background:rgba(255,255,255,.04);border:2px dashed var(--accent);border-radius:4px;outline:none;resize:none;overflow:hidden;white-space:pre;padding:0;margin:0;line-height:1.25;-webkit-user-select:text;user-select:text}
#dropHint{position:fixed;inset:12px;border:4px dashed var(--accent);border-radius:24px;background:rgba(37,99,235,.08);display:none;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--accent);z-index:80;pointer-events:none}
#dropHint.show{display:flex}

/* Rendu temporaire des documents Word */
.docx-host{position:fixed;left:0;top:0;z-index:-10;pointer-events:none}
.docx-page{width:816px;min-height:1056px;padding:72px;background:#fff;color:#000;font-family:Calibri,Carlito,Arial,sans-serif;font-size:15px;line-height:1.45;position:relative;overflow:hidden}
.docx-page img{max-width:100%;height:auto}
.docx-page table{border-collapse:collapse;margin:8px 0;max-width:100%}
.docx-page td,.docx-page th{border:1px solid #888;padding:4px 6px;vertical-align:top}
.docx-page h1{font-size:26px;margin:0 0 12px}.docx-page h2{font-size:21px;margin:16px 0 8px}.docx-page h3{font-size:18px;margin:14px 0 6px}
.docx-page p{margin:0 0 10px}

#print{display:none}
@media print{
  @page{size:landscape;margin:8mm}
  body>*:not(#print){display:none!important}
  html,body{overflow:visible;height:auto;background:#fff}
  #print{display:block}
  #print .pp{page-break-after:always;break-after:page;display:flex;align-items:center;justify-content:center;height:190mm}
  #print .pp:last-child{page-break-after:auto;break-after:auto}
  #print img{max-width:100%;max-height:190mm}
}
@media (max-height:1000px){ :root{--btn:46px} }
@media (max-height:860px){ :root{--btn:40px} svg.i{width:23px;height:23px} }
@media (max-width:700px){ :root{--btn:44px} .grid{grid-template-columns:repeat(4,50px)} .gb{width:50px;height:50px} }
</style>
</head>

/* ---------- Pages web et partage d'écran en direct ---------- */

function syncDom() {

    seen.add(o.id);
    let el = domEls.get(o.id);

    if (o.t === 'web' && el.dataset.url !== o.url) { el.dataset.url = o.url; el.querySelector('.cap span').textContent = o.url; el.querySelector('iframe').src = o.url; }
    if (o.t === 'live') {

    el.style.transform = `translate(${o.x * v.z + v.x}px,${o.y * v.z + v.y}px) scale(${v.z})`;

function drawDomPlaceholder(ctx, o) {

function normalizeUrl(u) {

  if ((m = u.match(/vimeo\.com\/(\d+)/)) && !/player\.vimeo/.test(u)) return `https://player.vimeo.com/video/${m[1]}`;

}

// Sites connus pour interdire l'affichage dans une autre page (X-Frame-Options / CSP)
function refusesEmbed(url) {

  if (/^(youtube-nocookie\.com|player\.vimeo\.com)$/.test(h) || /youtube\.com$/.test(h) && u.pathname.startsWith('/embed/')) return false;
  return /(^|\.)(google\.[a-z.]+|youtube\.com|bing\.com|facebook\.com|instagram\.com|twitter\.com|x\.com|linkedin\.com|github\.com|office\.com|microsoft\.com|live\.com|sharepoint\.com|onedrive\.live\.com|amazon\.[a-z.]+|netflix\.com|tiktok\.com|reddit\.com|chatgpt\.com|openai\.com|claude\.ai|teams\.microsoft\.com|classroom\.google\.com)$/.test(h);

    <li style="margin-top:10px">Revenez sur cet onglet du tableau, cliquez <b>Partager l’onglet</b>, puis choisissez l’onglet du site dans la liste.</li></ol>
    <p style="font-size:14px;color:var(--muted)">Vous annotez par-dessus l’image en direct. Pour naviguer dans le site, utilisez son propre onglet; le bouton « Figer » garde l’image actuelle.</p>`,
    [{ label: 'Annuler', value: false }, { label: 'Partager l’onglet', value: true, cls: 'primary' }],

async function insertLive(replaceObj) {

  catch (e) { if (e.name !== 'NotAllowedError') toast('Partage impossible : ' + e.message, 4000); return; }
  const track = stream.getVideoTracks()[0], st = track.getSettings();
  const ratio = (st.width && st.height) ? st.width / st.height : 16 / 9;
  let box = fitBoxInView(ratio * 0.97);
  if (replaceObj) box = { x: replaceObj.x, y: replaceObj.y, w: replaceObj.w, h: r1(replaceObj.w / ratio + CAP) };
  const o = { id: uid(), t: 'live', label: (track.label || '').slice(0, 60), ...box };
  liveStreams.set(o.id, stream);
  track.addEventListener('ended', () => { render(); toast('Partage d’écran terminé'); });
  if (replaceObj && page().objects.includes(replaceObj)) {
    snapshot(); replaceObj_(replaceObj, o); setTool('select'); S.sel = [o.id]; afterChange();
  } else addDomObj(o);

}

// Remplace une page web / un partage en direct par une image fixe
async function freezeDom(o) {
  const el = domEls.get(o.id); if (!el) return;
  let canvas;
  if (o.t === 'live') {
    const vid = el.querySelector('video');
    if (!vid || vid.readyState < 2) { toast('Aucune image à figer : le partage est terminé.'); return; }
    canvas = document.createElement('canvas'); canvas.width = vid.videoWidth; canvas.height = vid.videoHeight;
    canvas.getContext('2d').drawImage(vid, 0, 0);
  } else {
    if (!navigator.mediaDevices?.getDisplayMedia) { toast('Fonction non disponible dans ce navigateur.'); return; }
    toast('Choisissez « Cet onglet » puis « Partager » pour photographier la page.', 0);
    let stream;
    try { stream = await navigator.mediaDevices.getDisplayMedia({ video: { displaySurface: 'browser' }, audio: false, preferCurrentTab: true, selfBrowserSurface: 'include' }); }
    catch (e) { hideToast(); return; }
    try {
      document.body.classList.add('capturing'); S.sel = []; render();
      const vid = document.createElement('video'); vid.srcObject = stream; vid.muted = true; await vid.play();
      await new Promise(r => setTimeout(r, 700));
      const fr = el.querySelector('iframe').getBoundingClientRect();
      const kx = vid.videoWidth / window.innerWidth, ky = vid.videoHeight / window.innerHeight;
      if (Math.abs(kx - ky) / kx > .08) throw new Error('Il faut partager cet onglet (et non un autre écran).');
      const sx = Math.max(0, fr.left), sy = Math.max(0, fr.top), ex = Math.min(window.innerWidth, fr.right), ey = Math.min(window.innerHeight, fr.bottom);
      if (ex - sx < 20 || ey - sy < 20) throw new Error('La page doit être visible à l’écran.');
      canvas = document.createElement('canvas'); canvas.width = Math.round((ex - sx) * kx); canvas.height = Math.round((ey - sy) * ky);
      canvas.getContext('2d').drawImage(vid, sx * kx, sy * ky, canvas.width, canvas.height, 0, 0, canvas.width, canvas.height);
      // zone réellement visible, en unités du tableau
      const v = V(); o = { ...o, _crop: { x: (sx - v.x) / v.z, y: (sy - v.y) / v.z, w: (ex - sx) / v.z, h: (ey - sy) / v.z } };
    } catch (e) { toast(e.message || 'Capture impossible', 5000); canvas = null; }
    finally { stream.getTracks().forEach(t => t.stop()); document.body.classList.remove('capturing'); hideToast(); }
    if (!canvas) { render(); return; }
  }

  if (o._crop) rect = o._crop;

    const a = o.w / (o.h - CAP), r = canvas.width / canvas.height;
    const w = r > a ? o.w : (o.h - CAP) * r, h = r > a ? o.w / r : o.h - CAP;
    rect = { x: o.x + (o.w - w) / 2, y: o.y + CAP + (o.h - CAP - h) / 2, w, h };
  }
  const img = { id: uid(), t: 'image', a: addAsset(canvas.toDataURL('image/jpeg', .92)), x: r1(rect.x), y: r1(rect.y), w: r1(rect.w), h: r1(rect.h), lock: 1, doc: 1 };
  snapshot();
  const objs = page().objects, i = objs.findIndex(x => x.id === o.id);
  if (i >= 0) objs.splice(i, 1, img); else objs.unshift(img);
  if (o.t === 'live') stopLive(o.id);
  S.sel = []; afterChange();
  toast('Image figée et verrouillée : vos annotations restent en place.', 4000);
}

/* ---------- Sauvegarde ---------- */
function serialize() {
  const used = new Set(); S.doc.pages.forEach(p => p.objects.forEach(o => o.a && used.add(o.a)));
  const assets = {}; for (const id of used) if (S.doc.assets[id]) assets[id] = S.doc.assets[id];
  return { app: 'tableau-interactif', v: 1, cur: S.cur, pages: S.doc.pages, assets };
}
function loadDoc(d) {
  if (!d || !Array.isArray(d.pages) || !d.pages.length) throw new Error('Fichier invalide');
  for (const p of d.pages) {
    p.id ||= uid(); p.bg ||= { type: 'blank', paper: 'white', clef: 'g' }; p.objects ||= []; p.view ||= { x: 0, y: 0, z: 1 };
    // anciens fonds de page → feuille (objet redimensionnable)
    if (p.bg.type && p.bg.type !== 'blank') {
      const v = p.view, w = (window.innerWidth || 1600) / v.z, h = (window.innerHeight || 900) / v.z;
      p.objects.unshift({ id: uid(), t: 'sheet', kind: p.bg.type, clef: p.bg.clef || 'g', paper: p.bg.paper || 'white', x: r1(-v.x / v.z), y: r1(-v.y / v.z), w: r1(w), h: r1(h) });
      p.bg.type = 'blank';
    }
  }
  S.doc = { pages: d.pages, assets: d.assets || {} };
  try { d.pages.forEach(assignAtt); } catch (_) {}
  S.cur = clamp(d.cur | 0, 0, d.pages.length - 1);
  hist.clear(); imgCache.clear(); S.sel = [];
}
const DB = {
  db: null,
  open() {
    if (this.db) return Promise.resolve(this.db);
    return new Promise((res, rej) => {
      const r = indexedDB.open('tableau-interactif', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kv');
      r.onsuccess = () => { this.db = r.result; res(this.db); }; r.onerror = () => rej(r.error);
    });
  },
  async get(k) { const db = await this.open(); return new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); }); },
  async set(k, v) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = () => rej(t.error); }); },
};

  <p><b>Niveau et matière</b> : le bouton en haut à gauche choisit le niveau (préscolaire, 1er, 2e ou 3e cycle, secondaire) et la matière; seuls les outils utiles sont affichés. <b>Mode élève</b> (menu) : verrouille avec un code les fonctions sensibles.</p>
  <p><b>Sélection multiple et groupes</b> : l’outil lasso (sous la flèche) permet d’entourer plusieurs objets; touchez ensuite « Grouper » (ou <kbd>Ctrl+G</kbd>). Un groupe se sélectionne et se déplace d’un seul geste; « Dégrouper » le défait. Avec la flèche, <kbd>Maj</kbd> + clic ajoute un objet à la sélection.</p>
  <p><b>Formes 3D</b> : <i>Insérer → Formes 3D</i> ouvre l’atelier : ajoutez cubes, cylindres, cônes…, réglez leurs dimensions en mm, transformez une forme en « trou » puis groupez-la avec une autre pour la soustraire. L’image insérée se modifie par double-clic.</p>
  <p><b>Aimant</b> (bouton 🧲 du crayon et des formes) : un trait presque droit devient une ligne droite; les formes s’accrochent aux sommets des autres formes et au quadrillage des feuilles. En redimensionnant une feuille, elle « colle » au format lettre 8,5 × 11.</p>
  <p><b>Feuilles</b> : ce qui est écrit ou posé sur une feuille (et qui la touche) la suit quand on la déplace.</p>
  <p><b>Appui long</b> : maintenez le doigt immobile sur le tableau pour ouvrir le menu des <b>3 derniers outils utilisés</b> (glissez sur un choix ou touchez-le). Un symbole (GN, Prédicat…) ou une forme y est posé directement à cet endroit.</p>
  <p><b>Formes, flèches, texte et symboles</b> : après chaque ajout, l’outil Sélection revient automatiquement. Double-cliquez un outil pour le garder actif.</p>
  <p><b>Feuilles</b> : le bouton quadrillé insère une feuille (quadrillée, portée, plan cartésien…) que l’on déplace et redimensionne comme un objet.</p>
  <p><b>Objets</b> : avec l’outil Sélection, touchez un objet pour le déplacer; tirez les coins pour le redimensionner. Double-cliquez un texte pour le modifier. Les documents PDF/Word insérés sont <b>verrouillés</b> (double-clic pour les sélectionner).</p>
  <p><b>Raccourcis</b> : <kbd>V</kbd> sélection, <kbd>Q</kbd> lasso, <kbd>H</kbd> main, <kbd>P</kbd> crayon, <kbd>S</kbd> surligneur, <kbd>E</kbd> gomme, <kbd>R</kbd> formes, <kbd>F</kbd> flèches, <kbd>T</kbd> texte, <kbd>L</kbd> laser,
  <kbd>Ctrl+Z</kbd> annuler, <kbd>Ctrl+Y</kbd> rétablir, <kbd>Suppr</kbd> supprimer, <kbd>Ctrl+D</kbd> dupliquer, <kbd>Ctrl+V</kbd> coller une image ou du texte,
  <kbd>Page préc./suiv.</kbd> changer de page, <kbd>0</kbd> tout afficher, <kbd>Ctrl+S</kbd> enregistrer.</p>
  <p><b>Pages web</b> : <i>Insérer → Page web</i> affiche un site en direct; écrivez par-dessus. Pour cliquer ou défiler dans la page, sélectionnez-la puis touchez le bouton « main ». Si la page reste vide ou affiche 🚫, le site interdit l’affichage intégré : sélectionnez le cadre puis le bouton écran pour l’afficher en direct depuis un onglet. Le bouton « Figer » (appareil photo) transforme la page en image pour que les annotations restent alignées.</p>
  <p><b>Sauvegarde</b> : le tableau est conservé automatiquement dans ce navigateur. Pour le garder ou le partager, utilisez <i>Menu → Enregistrer le tableau</i> (fichier .tableau).</p>`,
    [{ label: 'Fermer', value: true, cls: 'primary' }]);
}
function toggleFull() {
  if (document.fullscreenElement) document.exitFullscreen?.();
  else document.documentElement.requestFullscreen?.().catch(() => toast('Plein écran indisponible. Essayez F11.'));
}

$('#bUndo').addEventListener('click', undo);
$('#bRedo').addEventListener('click', redo);
$('#bClear').addEventListener('click', () => {
  if (isLocked()) return;
  if (!page().objects.length) return;
  snapshot(); page().objects = []; afterChange(); toast('Page effacée — Ctrl+Z ou ↶ pour annuler');
});
$('#bZoomIn').addEventListener('click', () => zoomAt(W / 2, H / 2, 1.25));
$('#bZoomOut').addEventListener('click', () => zoomAt(W / 2, H / 2, .8));
$('#zoomLabel').addEventListener('click', zoomReset);
$('#bFit').addEventListener('click', fitAll);
$('#bPrev').addEventListener('click', () => goPage(S.cur - 1));
$('#bNext').addEventListener('click', () => goPage(S.cur + 1));
$('#bAddPage').addEventListener('click', addPage);
$('#bAddPage2').addEventListener('click', addPage);
$('#pageLabel').addEventListener('click', () => $('#pagesPanel').classList.contains('open') ? closePages() : openPages());
$('#bPages').addEventListener('click', () => $('#pagesPanel').classList.contains('open') ? closePages() : openPages());
$('#bClosePages').addEventListener('click', closePages);
$('#bFull').addEventListener('click', toggleFull);
$('#bHelp').addEventListener('click', showHelp);
window.addEventListener('resize', () => { resize(); layoutTextEditor(); });

// Rafraîchit les mesures quand les polices (musique, Andika) sont chargées
function fontsChanged() { clefCache = {}; tmCache = new WeakMap(); bbCache = new WeakMap(); render(); }
if (document.fonts) {
  document.fonts.addEventListener?.('loadingdone', fontsChanged);
  Promise.all([document.fonts.load(`40px "Noto Music"`, '\u{1D11E}'), document.fonts.load('40px Andika')]).then(fontsChanged).catch(() => {});
}

/* ---------- Démarrage ---------- */
(async function init() {
  S.doc = { pages: [newPage()], assets: {} };
  try { const d = await DB.get('doc'); if (d) loadDoc(d); } catch (_) {}
  resize(); applyLock(); applyProfile(); setTool(toolVisible('pen') ? 'pen' : 'select'); adaptInk(); goPage(S.cur);
  if (!S.profile) setTimeout(() => chooseProfile(true), 400);
})();
</script>
</body>
</html>
