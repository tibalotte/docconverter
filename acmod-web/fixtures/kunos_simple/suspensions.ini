; Fixture SYNTHÉTIQUE pour acmod-web
[HEADER]
VERSION=4

[BASIC]
WHEELBASE=2.53			; Wheelbase distance in meters
CG_LOCATION=0.52		; Front Weight distribution in percentage

[ARB]
FRONT=32000			; Front antiroll bar stifness. in Nm
REAR=12000			; Rear antiroll bar stifness. in Nm

[FRONT]
TYPE=DWB				; Suspension type
BASEY=-0.05			; Distance of CG from the center of the wheel in meters
TRACK=1.48			; Track width in meters (from pivot 3D placement of the 3d model of a wheel)
ROD_LENGTH=0.0			; push rod length in meters
HUB_MASS=38			; masse of the suspension hub
RIM_OFFSET=0.0
WBCAR_TOP_FRONT=0.2, 0.18, -0.03		; Wishbone car top front point
WBCAR_TOP_REAR=0.2, 0.18, 0.25
WBCAR_BOTTOM_FRONT=0.03, -0.09, -0.04
WBCAR_BOTTOM_REAR=0.03, -0.09, 0.30
WBTYRE_TOP=-0.07, 0.15, 0.0
WBTYRE_BOTTOM=-0.10, -0.11, 0.0
WBCAR_STEER=0.15, -0.025, -0.13
WBTYRE_STEER=-0.04, -0.03, -0.13
TOE_OUT=0.001			; Toe-out expressed as the length of the steering arm in meters
STATIC_CAMBER=-1.5		; Static Camber in degrees
SPRING_RATE=90000		; Wheel rate stiffness in Nm
PROGRESSIVE_SPRING_RATE=0	; progressive spring rate in N/m/m
BUMP_STOP_RATE=500000		; bump stop spring rate
BUMPSTOP_UP=0.08			; meters to upper bumpstop from the 0 design of the suspension
BUMPSTOP_DN=0.08			; meters to bottom bumpstop from the 0 design of the suspension
PACKER_RANGE=0.1		; Total suspension movement range, before hitting packers
DAMP_BUMP=3500			; Damper wheel rate stiffness in N sec/m in slow speed compression
DAMP_FAST_BUMP=2500		; Damper wheel rate stiffness in N sec/m in fast speed compression
DAMP_FAST_BUMPTHRESHOLD=0.15	; Damper wheel rate speed threshold where fast speed compression starts
DAMP_REBOUND=7000		; Damper wheel rate stiffness in N sec/m in slow speed rebound
DAMP_FAST_REBOUND=4000		; Damper wheel rate stiffness in N sec/m in fast speed rebound
DAMP_FAST_REBOUNDTHRESHOLD=0.15	; Damper wheel rate speed threshold where fast speed rebound starts

[REAR]
